# Off-host dead-man check: fails (and GitHub emails the owner) if the public
# radar status.json stops updating. Reads only public data; holds no secrets.

name: radar dead-man

on:
  schedule:
    # Three off-peak minutes per hour. GitHub's scheduler is best-effort: a
    # single '*/30' entry (top-of-hour, the busiest slot) was observed running
    # only every 3-6 h, which let the 2026-11-07 outage (15:23-18:00 IST) go
    # unseen. Off-peak minutes and several entries raise the odds that at
    # least one run lands inside any outage window.
    - cron: '7 * * * *'
    - cron: '27 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the radar is still publishing
        shell: bash
        run: |
          set -uo pipefail

          URL="https://kplns.com/radar/status.json"
          # The page is republished at least hourly (heartbeat commit at :12),
          # and GitHub may run this job late. 120 minutes = two missed hourly
          # heartbeats: past any normal lag, short enough to catch a ~2.5 h
          # outage like 2026-11-07 (was 150, tightened 2026-11-08).
          MAX_AGE_MIN=120
          # A fresh timestamp is not the same as a working radar. If most
          # collectors fail but at least one succeeds, monitor.py still writes
          # a new `generated` and the page keeps looking current — so an
          # age-only check prints "sources: 1/16" and then "Radar is alive."
          # Verification audit, 2026-08-23. Half the sources is the line: one
          # or two collectors failing is ordinary and already shows up as
          # `degraded` on the page, but a majority down means the level being
          # published is no longer supported by the evidence it claims.
          MIN_SOURCE_FRACTION=0.5

          body=""
          for attempt in 1 2 3; do
            # A single CDN blip must not email anyone. Only a repeated failure
            # counts as evidence.
            if body=$(curl -fsS --max-time 30 "$URL"); then
              echo "fetch ok on attempt $attempt"
              break
            fi
            echo "fetch attempt $attempt failed"
            body=""
            sleep 20
          done

          if [ -z "$body" ]; then
            echo "::error::Could not fetch $URL after 3 attempts."
            echo "The radar page may be down, or the site may not be publishing."
            exit 1
          fi

          printf '%s' "$body" > status.json

          python3 - "$MAX_AGE_MIN" "$MIN_SOURCE_FRACTION" <<'PY'
          import json, sys
          from datetime import datetime, timezone

          max_age_min = int(sys.argv[1])
          min_fraction = float(sys.argv[2])

          try:
              with open("status.json", encoding="utf-8") as fh:
                  doc = json.load(fh)
              stamp = doc["generated"]
          except Exception as e:
              print(f"::error::status.json is unreadable or has no 'generated' "
                    f"field ({e}). The publisher may be writing corrupt output.")
              raise SystemExit(1)

          try:
              gen = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
              if gen.tzinfo is None:
                  gen = gen.replace(tzinfo=timezone.utc)
          except ValueError as e:
              print(f"::error::Cannot parse 'generated' = {stamp!r} ({e}).")
              raise SystemExit(1)

          age_min = (datetime.now(timezone.utc) - gen).total_seconds() / 60
          print(f"generated: {stamp}")
          print(f"age: {age_min:.0f} min (threshold {max_age_min} min)")
          print(f"sources: {doc.get('sources_ok')}/{doc.get('sources_total')}")

          if age_min > max_age_min:
              print(f"::error::The escalation radar has not published for "
                    f"{age_min:.0f} minutes (threshold {max_age_min}). The home "
                    f"server, its cron daemon, or monitor.py is likely down — "
                    f"and because watchdog.py runs on that same host, it cannot "
                    f"tell you. Check the server.")
              raise SystemExit(1)

          # Staleness is checked first because a dead host makes the source
          # counts meaningless: they would be whatever the last live run wrote.
          ok = doc.get("sources_ok")
          total = doc.get("sources_total")
          if not isinstance(ok, int) or not isinstance(total, int) or total <= 0:
              print(f"::error::status.json has no usable source counts "
                    f"(sources_ok={ok!r}, sources_total={total!r}). The "
                    f"publisher is writing output this check cannot verify.")
              raise SystemExit(1)

          floor = total * min_fraction
          if ok < floor:
              print(f"::error::The radar published a fresh page while blind: "
                    f"only {ok} of {total} sources were readable (threshold "
                    f"{floor:.0f}). The timestamp is current, so the host is "
                    f"alive and nothing on it will raise this — but the level "
                    f"on the page is no longer supported by the evidence it "
                    f"claims. Check the collectors.")
              raise SystemExit(1)

          print("Radar is alive.")
          PY
